<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pobre Maria — Gastronomia com Identidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EE;
    --bg2: #EFE9E0;
    --ink: #1C1410;
    --ink2: #6B5B4E;
    --ink3: #A0907F;
    --accent: #8B3A2A;
    --accent2: #C4603A;
    --line: rgba(28,20,16,.12);
    --green: #3B6D11;
    --green-bg: #EAF3DE;
    --warn: #993C1D;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--line);
    padding: 2.5rem 2rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .site-eyebrow {
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: .5rem;
  }
  .site-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 300;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -.02em;
  }
  .site-title em {
    font-style: italic;
    color: var(--accent);
  }
  .site-sub {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-top: .75rem;
  }

  /* ── NAV ── */
  nav {
    max-width: 900px;
    margin: 0 auto;
    padding: .75rem 2rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .nav-label {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-right: 6px;
  }
  .filter-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink2);
    cursor: pointer;
    transition: all .15s;
    letter-spacing: .04em;
  }
  .filter-btn:hover { border-color: var(--ink3); color: var(--ink); }
  .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ── MAIN ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1px;
    border: 1px solid var(--line);
  }
  .card {
    background: var(--bg);
    padding: 1.25rem 1.25rem 1rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, border-color .15s;
    position: relative;
  }
  .card:hover { background: var(--bg2); }
  .card-tag {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: .5rem;
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: .75rem;
  }
  .card-prog {
    height: 1px;
    background: var(--line);
    margin-bottom: .75rem;
    overflow: hidden;
  }
  .card-prog-fill {
    height: 100%;
    background: var(--green);
    transition: width .4s;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border: 1px solid;
  }
  .badge-ok { color: var(--green); border-color: var(--green-bg); background: var(--green-bg); }
  .card-time {
    font-size: 10px;
    color: var(--ink3);
    letter-spacing: .04em;
  }

  /* ── DETAIL ── */
  #detail { display: none; }
  #detail.open { display: block; }
  #home.hidden { display: none; }

  .back-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink3);
    padding: 0;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color .15s;
  }
  .back-btn:hover { color: var(--ink); }

  .detail-eyebrow {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: .5rem;
  }
  .detail-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 300;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: .5rem;
  }
  .detail-desc {
    font-size: 12px;
    color: var(--ink2);
    margin-bottom: 1rem;
    max-width: 520px;
    line-height: 1.7;
  }
  .detail-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 1.25rem;
  }

  /* ── TIMELINE ── */
  .tl-section { margin-bottom: 1.5rem; }
  .tl-label-row {
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: .5rem;
  }
  .tl-track {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tl-step { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tl-bar {
    height: 4px;
    background: var(--bg2);
    border: 1px solid var(--line);
    transition: background .25s;
    min-width: 32px;
  }
  .tl-bar.done { background: var(--green); border-color: var(--green); }
  .tl-step-label { font-size: 9px; color: var(--ink3); white-space: nowrap; letter-spacing: .04em; }
  .tl-step-min { font-size: 9px; color: var(--ink3); }

  /* ── PROGRESS ── */
  .prog-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .prog-track {
    flex: 1;
    height: 1px;
    background: var(--line);
    overflow: hidden;
  }
  .prog-fill { height: 100%; background: var(--green); transition: width .3s; }
  .prog-txt { font-size: 10px; color: var(--ink3); white-space: nowrap; letter-spacing: .04em; }

  /* ── ETAPAS ── */
  .etapas { display: flex; flex-direction: column; gap: 1px; }
  .etapa {
    border: 1px solid var(--line);
    background: var(--bg);
    transition: border-color .2s;
  }
  .etapa.done { border-color: var(--green); }
  .etapa-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: .75rem 1rem;
    cursor: pointer;
    user-select: none;
  }
  .etapa-hdr:hover { background: var(--bg2); }
  .chk {
    width: 16px; height: 16px;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
    font-size: 9px;
    color: transparent;
  }
  .etapa.done .chk { background: var(--green); border-color: var(--green); color: #fff; }
  .etapa-num { font-size: 10px; color: var(--ink3); width: 16px; flex-shrink: 0; letter-spacing: .04em; }
  .etapa-nome { font-size: 13px; color: var(--ink); flex: 1; letter-spacing: .02em; }
  .etapa-tempo { font-size: 10px; color: var(--ink3); flex-shrink: 0; }
  .etapa-body { display: none; padding: 0 1rem .875rem 2.875rem; }
  .etapa-body.open { display: block; }
  .ing-hdr {
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 4px;
    margin-top: 2px;
  }
  table.ing { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  table.ing td {
    font-size: 11px;
    padding: 3px 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink2);
  }
  table.ing td:last-child { text-align: right; color: var(--ink); }
  .body-txt { font-size: 12px; color: var(--ink2); line-height: 1.65; margin-bottom: 4px; }
  .aviso-txt { font-size: 11px; color: var(--warn); font-style: italic; line-height: 1.5; }

  .reset-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .08em;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink3);
    padding: 0;
    margin-top: 1rem;
    transition: color .15s;
  }
  .reset-btn:hover { color: var(--ink); }

  /* ── FOOTER ── */
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 2rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .footer-l { font-size: 10px; color: var(--ink3); letter-spacing: .08em; }
  .footer-r { font-size: 10px; color: var(--ink3); letter-spacing: .08em; }

  @media (max-width: 600px) {
    header, nav, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="site-eyebrow">Sul do Brasil · Project Gastronomia</div>
  <h1 class="site-title">Pobre <em>Maria</em></h1>
  <p class="site-sub">Gastronomia com Identidade &nbsp;·&nbsp; v1</p>
</header>

<nav>

  <span class="footer-l">Pobre Maria · jun/2026</span>

</footer>

const chk={};
R.forEach(r=>{chk[r.id]=new Array(r.etapas.length).fill(false)});
let currentCat="todas";

function setCat(c,btn){
  currentCat=c;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderGrid();
}

function renderGrid(){
  const list=currentCat==="todas"?R:R.filter(r=>r.cat===currentCat);
  document.getElementById("grid").innerHTML=list.map(r=>{
    const done=chk[r.id].filter(Boolean).length;
    const pct=r.etapas.length?Math.round(done/r.etapas.length*100):0;
    return `<div class="card" onclick="openR('${r.id}')">
      <div class="card-tag">${r.tag}</div>
      <div class="card-title">${r.titulo}</div>
      <div class="card-prog"><div class="card-prog-fill" style="width:${pct}%"></div></div>
      <div class="card-meta">
        <span class="badge badge-ok">Consolidada</span>
        <span class="card-time">${r.tempo}</span>
      </div>
    </div>`;
  }).join("");
}

function buildTL(r){
  const total=r.tl.reduce((a,t)=>a+t.m,0);
  const done=chk[r.id].filter(Boolean).length;
  return `<div class="tl-section">
    <div class="tl-label-row">Linha do tempo</div>
    <div class="tl-track">${r.tl.map((t,i)=>{
      const w=Math.max(36,Math.round(t.m/total*340));
      return `<div class="tl-step">
        <div class="tl-bar${i<done?' done':''}" style="width:${w}px"></div>
        <div class="tl-step-label">${t.e}</div>
        <div class="tl-step-min">${t.m>=60?Math.round(t.m/60)+'h':t.m+'m'}</div>
      </div>`;
    }).join("")}</div>
  </div>`;
}

function openR(id){
  const r=R.find(x=>x.id===id);
  const done=chk[r.id].filter(Boolean).length;
  const total=r.etapas.length;
  const pct=total?Math.round(done/total*100):0;

  const etHtml=r.etapas.map((e,i)=>{
    const isDone=chk[r.id][i];
    const ingH=e.ing?`<div class="ing-hdr">Ingredientes</div><table class="ing">${e.ing.map(([n,q])=>`<tr><td>${n}</td><td>${q}</td></tr>`).join("")}</table>`:'';
    return `<div class="etapa${isDone?' done':''}" id="et-${id}-${i}">
      <div class="etapa-hdr" onclick="toggleEt('${id}',${i})">
        <div class="chk">✓</div>
        <div class="etapa-num">0${e.n}</div>
        <div class="etapa-nome">${e.nome}</div>
        <div class="etapa-tempo">${e.t}</div>
      </div>
      <div class="etapa-body${isDone?' open':''}" id="bd-${id}-${i}">
        ${ingH}
        <div class="body-txt">${e.body}</div>
        ${e.aviso?`<div class="aviso-txt">${e.aviso}</div>`:''}
      </div>
    </div>`;
  }).join("");

  document.getElementById("detail").innerHTML=`
    <button class="back-btn" onclick="goHome()">← Voltar</button>
    <div class="detail-eyebrow">${r.tag}</div>
    <h2 class="detail-title">${r.titulo}</h2>
    <p class="detail-desc">${r.desc}</p>
    <div class="detail-meta">
      <span class="badge badge-ok">Consolidada</span>
      <span class="card-time">${r.tempo}</span>
      ${r.meta.map(m=>`<span class="card-time">${m}</span>`).join("")}
    </div>
    ${buildTL(r)}
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="pf-${id}" style="width:${pct}%"></div></div>
      <span class="prog-txt" id="pl-${id}">${done}/${total} etapas</span>
    </div>
    <div class="etapas">${etHtml}</div>
    <button class="reset-btn" onclick="resetR('${id}')">↺ reiniciar checklist</button>
  `;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("detail").classList.add("open");
  window.scrollTo(0,0);
}

function toggleEt(id,i){
  chk[id][i]=!chk[id][i];
  const el=document.getElementById(`et-${id}-${i}`);
  const bd=document.getElementById(`bd-${id}-${i}`);
  el.classList.toggle("done",chk[id][i]);
  bd.classList.toggle("open",chk[id][i]);
  updateProg(id);
}

function updateProg(id){
  const r=R.find(x=>x.id===id);
  const done=chk[id].filter(Boolean).length;
  const total=r.etapas.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById(`pf-${id}`).style.width=pct+"%";
  document.getElementById(`pl-${id}`).textContent=`${done}/${total} etapas`;
  document.querySelectorAll(`#detail .tl-bar`).forEach((b,i)=>{
    b.classList.toggle("done",i<done);
  });
}

function resetR(id){chk[id]=chk[id].map(()=>false);openR(id);}
function goHome(){
  document.getElementById("detail").classList.remove("open");
  document.getElementById("detail").innerHTML="";
  document.getElementById("home").classList.remove("hidden");
  window.scrollTo(0,0);
}

renderGrid();
</script>
