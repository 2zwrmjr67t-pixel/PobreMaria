<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pobre Maria — Família Marques Silva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 C16 2 20 8 18 13 C22 9 23 5 23 5 C23 5 28 12 26 19 C25 23 22 26 19 28 C20 26 20 23 18 22 C18 25 16 27 14 28 C10 26 7 22 7 18 C7 13 10 9 12 7 C11 11 12 14 14 15 C13 10 14 5 16 2Z' fill='%23C8A96E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant:ital,wght@0,300;0,600;0,700;1,300;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0E0C09;
  --bg2:    #161310;
  --bg3:    #1E1A15;
  --gold:   #D4B87A;
  --gold2:  #C0A050;
  --gold3:  #E8C98E;
  --ash:    #B0A080;
  --ash2:   #8A7A60;
  --cream:  #F0E6D0;
  --cream2: #E0D0B0;
  --line:   rgba(200,169,110,.18);
  --line2:  rgba(200,169,110,.10);
  --warn:   #E07030;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--cream2);
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  max-width: 1020px;
  margin: 0 auto;
  padding: 4rem 2.5rem 3rem;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.eyebrow {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: 1.5rem;
}
.title-wrap {
  display: flex;
  align-items: baseline;
  gap: .35em;
  flex-wrap: wrap;
}
.t-pobre {
  font-family: 'Libre Baskerville', serif;
  font-size: clamp(64px, 12vw, 120px);
  font-weight: 700;
  line-height: .9;
  color: var(--cream);
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.t-maria {
  font-family: 'Libre Baskerville', serif;
  font-size: clamp(64px, 12vw, 120px);
  font-weight: 700;
  font-style: italic;
  line-height: .9;
  color: var(--gold);
  letter-spacing: -.01em;
  text-transform: uppercase;
}
.header-rule {
  margin: 1.75rem 0 1.25rem;
  border: none;
  border-top: 1px solid var(--line);
}
.header-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.header-sub {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ash);
}
.header-count {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ash2);
}

/* ── NAV ── */
nav {
  max-width: 1020px;
  margin: 0 auto;
  padding: 0 2.5rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  display: flex;
  gap: 0;
  flex-wrap: wrap;
  align-items: stretch;
}
.filter-btn {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  padding: .875rem 1.25rem;
  border: none;
  border-right: 1px solid var(--line2);
  background: transparent;
  color: var(--ash);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.filter-btn:first-child { border-left: none; }
.filter-btn:hover { color: var(--cream); background: var(--bg3); }
.filter-btn.active {
  color: var(--gold);
  background: var(--bg3);
  border-bottom: 2px solid var(--gold);
}

/* ── MAIN ── */
main {
  max-width: 1020px;
  margin: 0 auto;
  padding: 2.5rem;
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1px;
  background: var(--line2);
}
.card {
  background: var(--bg);
  padding: 1.5rem 1.5rem 1.25rem;
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.card:hover { background: var(--bg2); }
.card:hover .card-title { color: var(--cream); }
.card-tag {
  font-family: 'EB Garamond', serif;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: .625rem;
}
.card-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--cream2);
  margin-bottom: .75rem;
  transition: color .15s;
}
.card-prog {
  height: 1px;
  background: var(--line2);
  margin-bottom: .875rem;
  overflow: hidden;
}
.card-prog-fill {
  height: 100%;
  background: var(--gold2);
  transition: width .4s;
}
.card-callout {
  font-family: 'Cormorant', serif;
  font-size: 14px;
  font-style: italic;
  font-weight: 300;
  color: var(--ash);
  line-height: 1.4;
  margin-bottom: .75rem;
}
.card-time {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ash2);
}

/* ── DETAIL ── */
#detail { display: none; }
#detail.open { display: block; }
#home.hidden { display: none; }

.back-btn {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  background: none;
  border: 1px solid var(--line);
  cursor: pointer;
  color: var(--ash);
  padding: .5rem 1.25rem;
  margin-bottom: 2rem;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .15s;
}
.back-btn:hover { border-color: var(--gold2); color: var(--gold); }

.detail-tag {
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--gold2);
  margin-bottom: .625rem;
  font-family: 'EB Garamond', serif;
}
.detail-title {
  font-family: 'Libre Baskerville', serif;
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 700;
  line-height: 1.0;
  color: var(--cream);
  margin-bottom: .625rem;
}
.detail-callout {
  font-family: 'Cormorant', serif;
  font-size: 18px;
  font-style: italic;
  font-weight: 300;
  color: var(--gold2);
  margin-bottom: .5rem;
  line-height: 1.4;
}
.detail-desc {
  font-size: 14px;
  color: var(--ash);
  margin-bottom: 1.25rem;
  max-width: 560px;
  line-height: 1.7;
}
.detail-rule {
  border: none;
  border-top: 1px solid var(--line);
  margin-bottom: 1.5rem;
}
.detail-meta {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.75rem;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label {
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ash2);
  font-family: 'EB Garamond', serif;
}
.meta-val {
  font-size: 13px;
  color: var(--cream2);
  letter-spacing: .04em;
  font-family: 'EB Garamond', serif;
}

/* ── TIMELINE ── */
.tl-section { margin-bottom: 2rem; }
.tl-label {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ash2);
  margin-bottom: .75rem;
  font-family: 'EB Garamond', serif;
}
.tl-track {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  overflow-x: auto;
  padding-bottom: 6px;
}
.tl-step { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.tl-bar {
  height: 3px;
  background: var(--bg3);
  border-bottom: 1px solid var(--ash2);
  transition: all .25s;
  min-width: 36px;
}
.tl-bar.done { background: var(--gold2); border-color: var(--gold); }
.tl-step-label {
  font-family: 'EB Garamond', serif;
  font-size: 10px;
  color: var(--ash2);
  white-space: nowrap;
  letter-spacing: .08em;
}
.tl-step-min {
  font-family: 'EB Garamond', serif;
  font-size: 10px;
  color: var(--ash2);
}

/* ── PROGRESS ── */
.prog-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1.5rem;
}
.prog-track {
  flex: 1;
  height: 1px;
  background: var(--line2);
  overflow: hidden;
}
.prog-fill { height: 100%; background: var(--gold2); transition: width .3s; }
.prog-txt {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--ash2);
  white-space: nowrap;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ── INGREDIENTES CONSOLIDADOS ── */
.ingredientes-section {
  border: 1px solid var(--line);
  margin-bottom: 2rem;
}
.ingredientes-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: .875rem 1.25rem;
  cursor: pointer;
  user-select: none;
  background: var(--bg2);
  transition: background .15s;
}
.ingredientes-hdr:hover { background: var(--bg3); }
.ing-caret {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--gold2);
  transition: transform .2s;
  flex-shrink: 0;
  width: 10px;
}
.ing-caret.open { transform: rotate(90deg); }
.ingredientes-title {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--cream);
  flex: 1;
}
.ingredientes-count {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--ash2);
  letter-spacing: .1em;
}
.ingredientes-body { display: none; padding: 1.25rem 1.25rem 0.5rem; }
.ingredientes-body.open { display: block; }
.ing-group { margin-bottom: 1.1rem; }
.ing-group:last-child { margin-bottom: .25rem; }
.ing-group-label {
  font-family: 'Cormorant', serif;
  font-size: 13px;
  font-style: italic;
  font-weight: 600;
  color: var(--gold2);
  margin-bottom: .4rem;
}

/* ── ETAPAS ── */
.etapas { display: flex; flex-direction: column; gap: 1px; background: var(--line2); }
.etapa {
  background: var(--bg);
  border-left: 2px solid transparent;
  transition: border-color .2s;
}
.etapa.done { border-left-color: var(--gold2); }
.etapa-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: .875rem 1.25rem;
  cursor: pointer;
  user-select: none;
}
.etapa-hdr:hover { background: var(--bg2); }
.chk {
  width: 15px; height: 15px;
  border: 1px solid var(--ash2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .2s;
  font-size: 9px;
  color: transparent;
  font-weight: 700;
}
.etapa.done .chk { background: var(--gold2); border-color: var(--gold2); color: var(--bg); }
.etapa-num {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--ash2);
  width: 20px;
  flex-shrink: 0;
  letter-spacing: .08em;
}
.etapa-nome {
  font-family: 'EB Garamond', serif;
  font-size: 16px;
  color: var(--cream);
  flex: 1;
  letter-spacing: .02em;
}
.etapa-tempo {
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  color: var(--ash);
  flex-shrink: 0;
  letter-spacing: .08em;
}
.etapa-body { display: none; padding: 0 1.25rem .875rem 3.25rem; }
.etapa-body.open { display: block; }

.ing-hdr {
  font-family: 'EB Garamond', serif;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold2);
  margin: 8px 0 6px;
}
table.ing { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.ing-row { cursor: pointer; transition: opacity .15s; }
.ing-row:hover { opacity: .85; }
.ing-row td { transition: color .2s; }
.ing-row.checked td { color: var(--ash2); text-decoration: line-through; opacity: .5; }
.ing-chk {
  width: 12px; height: 12px;
  border: 1px solid var(--ash2);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 8px; color: transparent;
  margin-right: 8px;
  flex-shrink: 0;
  vertical-align: middle;
  transition: all .15s;
}
.ing-row.checked .ing-chk { background: var(--gold2); border-color: var(--gold2); color: var(--bg); }
table.ing td {
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line2);
  color: var(--ash);
}
table.ing td:last-child { text-align: right; color: var(--cream2); }
.body-txt {
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  color: var(--cream2);
  line-height: 1.75;
  margin-bottom: 8px;
}
.aviso-txt {
  font-family: 'Cormorant', serif;
  font-size: 14px;
  font-style: italic;
  color: var(--warn);
  line-height: 1.55;
}

.reset-btn {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ash2);
  padding: 0;
  margin-top: 1.5rem;
  transition: color .15s;
}
.reset-btn:hover { color: var(--gold2); }

/* ── FOOTER ── */
footer {
  max-width: 1020px;
  margin: 0 auto;
  padding: 1.5rem 2.5rem;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.footer-txt {
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--ash2);
  letter-spacing: .16em;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  nav { padding-left: 1.5rem; }
  .grid { grid-template-columns: 1fr; }
  .t-pobre, .t-maria { font-size: 56px; }
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Receitas da Família Marques Silva &nbsp;·&nbsp; Sul do Brasil</div>
  <div class="title-wrap">
    <span class="t-pobre">Pobre</span>
    <span class="t-maria">Maria</span>
  </div>
  <hr class="header-rule">
  <div class="header-bottom">
    <span class="header-sub">Gastronomia com Identidade</span>
    <span class="header-count">12 receitas &nbsp;·&nbsp; v1 &nbsp;·&nbsp; jul/2026</span>
  </div>
</header>

<nav>
  <button class="filter-btn active" onclick="setCat('todas',this)">Todas</button>
  <button class="filter-btn" onclick="setCat('panificacao',this)">Panificação</button>
  <button class="filter-btn" onclick="setCat('confeitaria',this)">Confeitaria</button>
  <button class="filter-btn" onclick="setCat('sobremesa',this)">Sobremesa</button>
  <button class="filter-btn" onclick="setCat('parrilla',this)">Parrilla</button>
  <button class="filter-btn" onclick="setCat('massas',this)">Massas</button>
</nav>

<main>
  <div id="home"><div class="grid" id="grid"></div></div>
  <div id="detail"></div>
</main>

<footer>
  <span class="footer-txt">Família Marques Silva</span>
  <span class="footer-txt">Pobre Maria &nbsp;·&nbsp; v1</span>
</footer>

const chk={};
const ingChk={};
const consChk={};
const ingSectionOpen={};
R.forEach(r=>{
  chk[r.id]=new Array(r.etapas.length).fill(false);
  ingChk[r.id]=r.etapas.map(e=>e.ing?new Array(e.ing.length).fill(false):[]);
  consChk[r.id]=r.etapas.map(e=>e.ing?new Array(e.ing.length).fill(false):[]);
  ingSectionOpen[r.id]=false;
});
let currentCat="todas";

function setCat(c,btn){
  currentCat=c;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("detail").classList.remove("open");
  document.getElementById("detail").innerHTML="";
  document.getElementById("home").classList.remove("hidden");
  renderGrid();
  window.scrollTo(0,0);
}

function renderGrid(){
  const list=currentCat==="todas"?R:R.filter(r=>r.cat===currentCat);
  document.getElementById("grid").innerHTML=list.map(r=>{
    const done=chk[r.id].filter(Boolean).length;
    const pct=r.etapas.length?Math.round(done/r.etapas.length*100):0;
    return `<div class="card" onclick="openR('${r.id}')">
      <div class="card-tag">${r.tag}</div>
      <div class="card-title">${r.titulo}</div>
      <div class="card-callout">${r.callout}</div>
      <div class="card-prog"><div class="card-prog-fill" style="width:${pct}%"></div></div>
      <div class="card-time">${r.tempo}</div>
    </div>`;
  }).join("");
}

function buildTL(r){
  const total=r.tl.reduce((a,t)=>a+t.m,0);
  const done=chk[r.id].filter(Boolean).length;
  return `<div class="tl-section">
    <div class="tl-label">Linha do tempo</div>
    <div class="tl-track">${r.tl.map((t,i)=>{
      const w=Math.max(40,Math.round(t.m/total*380));
      return `<div class="tl-step">
        <div class="tl-bar${i<done?' done':''}" style="width:${w}px"></div>
        <div class="tl-step-label">${t.e}</div>
        <div class="tl-step-min">${t.m>=60?Math.round(t.m/60)+'h':t.m+'m'}</div>
      </div>`;
    }).join("")}</div>
  </div>`;
}

function buildIngredientes(r){
  const idxs=[];
  r.etapas.forEach((e,i)=>{ if(e.ing) idxs.push(i); });
  if(!idxs.length) return '';
  let done=0, total=0;
  const groupsHtml=idxs.map(i=>{
    const e=r.etapas[i];
    const rows=e.ing.map(([n,q],ii)=>{
      total++;
      const isChecked=consChk[r.id][i][ii];
      if(isChecked) done++;
      return `<tr class="ing-row${isChecked?' checked':''}" id="cir-${r.id}-${i}-${ii}" onclick="toggleConsIng('${r.id}',${i},${ii})"><td><span class="ing-chk">✓</span>${n}</td><td>${q}</td></tr>`;
    }).join("");
    return `<div class="ing-group"><div class="ing-group-label">${e.nome}</div><table class="ing">${rows}</table></div>`;
  }).join("");
  const isOpen=ingSectionOpen[r.id];
  return `<div class="ingredientes-section">
    <div class="ingredientes-hdr" onclick="toggleIngSection('${r.id}')">
      <div class="ing-caret${isOpen?' open':''}" id="ing-caret-${r.id}">▸</div>
      <div class="ingredientes-title">Ingredientes</div>
      <div class="ingredientes-count" id="ing-count-${r.id}">${done} / ${total}</div>
    </div>
    <div class="ingredientes-body${isOpen?' open':''}" id="ing-body-${r.id}">${groupsHtml}</div>
  </div>`;
}

function toggleIngSection(id){
  ingSectionOpen[id]=!ingSectionOpen[id];
  document.getElementById(`ing-caret-${id}`).classList.toggle("open",ingSectionOpen[id]);
  document.getElementById(`ing-body-${id}`).classList.toggle("open",ingSectionOpen[id]);
}

function toggleConsIng(id,i,ii){
  consChk[id][i][ii]=!consChk[id][i][ii];
  document.getElementById(`cir-${id}-${i}-${ii}`).classList.toggle("checked",consChk[id][i][ii]);
  updateIngCount(id);
}

function updateIngCount(id){
  const r=R.find(x=>x.id===id);
  let done=0,total=0;
  r.etapas.forEach((e,i)=>{
    if(e.ing){
      e.ing.forEach((_,ii)=>{
        total++;
        if(consChk[id][i][ii]) done++;
      });
    }
  });
  const el=document.getElementById(`ing-count-${id}`);
  if(el) el.textContent=`${done} / ${total}`;
}

function openR(id){
  const r=R.find(x=>x.id===id);
  const done=chk[r.id].filter(Boolean).length;
  const total=r.etapas.length;
  const pct=total?Math.round(done/total*100):0;
  const metaHtml=r.meta.map(([l,v])=>`<div class="meta-item"><span class="meta-label">${l}</span><span class="meta-val">${v}</span></div>`).join("");
  const etHtml=r.etapas.map((e,i)=>{
    const isDone=chk[r.id][i];
    const ingH=e.ing?`<div class="ing-hdr">Ingredientes</div><table class="ing">${e.ing.map(([n,q],ii)=>`<tr class="ing-row" id="ir-${id}-${i}-${ii}" onclick="toggleIng('${id}',${i},${ii})"><td><span class="ing-chk">✓</span>${n}</td><td>${q}</td></tr>`).join("")}</table>`:'';
    return `<div class="etapa${isDone?' done':''}" id="et-${id}-${i}">
      <div class="etapa-hdr" onclick="toggleEt('${id}',${i})">
        <div class="chk">✓</div>
        <div class="etapa-num">0${e.n}</div>
        <div class="etapa-nome">${e.nome}</div>
        <div class="etapa-tempo">${e.t}</div>
      </div>
      <div class="etapa-body${isDone?' open':''}" id="bd-${id}-${i}">
        ${ingH}
        <div class="body-txt">${e.body}</div>
        ${e.aviso?`<div class="aviso-txt">${e.aviso}</div>`:''}
      </div>
    </div>`;
  }).join("");

  document.getElementById("detail").innerHTML=`
    <button class="back-btn" onclick="goHome()">← Voltar</button>
    <div class="detail-tag">${r.tag}</div>
    <h2 class="detail-title">${r.titulo}</h2>
    <div class="detail-callout">${r.callout}</div>
    <p class="detail-desc">${r.desc}</p>
    <hr class="detail-rule">
    <div class="detail-meta">${metaHtml}<div class="meta-item"><span class="meta-label">Tempo total</span><span class="meta-val">${r.tempo}</span></div></div>
    ${buildIngredientes(r)}
    ${buildTL(r)}
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="pf-${id}" style="width:${pct}%"></div></div>
      <span class="prog-txt" id="pl-${id}">${done} / ${total} etapas</span>
    </div>
    <div class="etapas">${etHtml}</div>
    <button class="reset-btn" onclick="resetR('${id}')">↺ reiniciar checklist</button>
  `;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("detail").classList.add("open");
  window.scrollTo(0,0);
}

function toggleEt(id,i){
  chk[id][i]=!chk[id][i];
  document.getElementById(`et-${id}-${i}`).classList.toggle("done",chk[id][i]);
  document.getElementById(`bd-${id}-${i}`).classList.toggle("open",chk[id][i]);
  updateProg(id);
}

function updateProg(id){
  const r=R.find(x=>x.id===id);
  const done=chk[id].filter(Boolean).length;
  const total=r.etapas.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById(`pf-${id}`).style.width=pct+"%";
  document.getElementById(`pl-${id}`).textContent=`${done} / ${total} etapas`;
  document.querySelectorAll(`#detail .tl-bar`).forEach((b,i)=>b.classList.toggle("done",i<done));
}

function toggleIng(id,i,ii){
  ingChk[id][i][ii]=!ingChk[id][i][ii];
  document.getElementById(`ir-${id}-${i}-${ii}`).classList.toggle("checked",ingChk[id][i][ii]);
}

function resetR(id){
  chk[id]=chk[id].map(()=>false);
  ingChk[id]=R.find(x=>x.id===id).etapas.map(e=>e.ing?new Array(e.ing.length).fill(false):[]);
  consChk[id]=R.find(x=>x.id===id).etapas.map(e=>e.ing?new Array(e.ing.length).fill(false):[]);
  openR(id);
}

function goHome(){
  document.getElementById("detail").classList.remove("open");
  document.getElementById("detail").innerHTML="";
  document.getElementById("home").classList.remove("hidden");
  window.scrollTo(0,0);
}

renderGrid();
</script>
</body>
</html>
